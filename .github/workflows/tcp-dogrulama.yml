name: TCP derleme ve dogrulama
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dogrulama:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Temiz derleme ve 36 kontrol
        run: bash "702_Yazilim_Isleri/TCP_Tabanli_Metin_ve_Goruntu_Mesajlasma_Uygulamasi/02_Derleme_ve_Calistirma_Dosyalari/dogrula.sh"
      - name: Test raporu
        if: always()
        run: |
          report="702_Yazilim_Isleri/TCP_Tabanli_Metin_ve_Goruntu_Mesajlasma_Uygulamasi/03_Test_ve_Dogrulama_Calismalari/Test_Sonuclari/SON_TEST_RAPORU.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
