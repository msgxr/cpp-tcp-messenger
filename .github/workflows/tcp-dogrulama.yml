name: TCP derleme ve dogrulama

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dogrulama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Gerekli araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential chafa tmux

      - name: Temiz derleme ve C++ dogrulama
        run: |
          chmod +x 702_Yazilim_Isleri/TCP_Tabanli_Metin_ve_Goruntu_Mesajlasma_Uygulamasi/02_Derleme_ve_Calistirma_Dosyalari/*.sh
          bash 702_Yazilim_Isleri/TCP_Tabanli_Metin_ve_Goruntu_Mesajlasma_Uygulamasi/02_Derleme_ve_Calistirma_Dosyalari/dogrula.sh